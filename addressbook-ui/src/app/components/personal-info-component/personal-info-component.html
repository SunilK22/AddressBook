<div class="example-form" [formGroup]="personalInfoForm">
    <header>
        <h3>
            Personal Information
        </h3>
    </header>
    <div class="container">
        <mat-label>
            Title
            <div>
                <mat-form-field>
                    <mat-label>--Select--</mat-label>
                    <mat-select formControlName="title">
                        @for (item of titles; track item) {
                        <mat-option [value]="item.value">{{item.viewValue}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </div>
        </mat-label>
        <label>
            First Name
            <div>
                <mat-form-field>
                    <input matInput formControlName="firstname" />
                </mat-form-field>
            </div>
        </label>

        <label>
            Middle Name
            <div>
                <mat-form-field>

                    <input matInput formControlName="middlename" />
                </mat-form-field>
            </div>
        </label>
        <label>
            Last Name
            <div>
                <mat-form-field>

                    <input formControlName="lastname" matInput />
                </mat-form-field>
            </div>
        </label>


    </div>
    <div class="container">
        <label>
            Gender
            <div>
                <mat-radio-group formControlName="gender" aria-label="Select an option">
                    <mat-radio-button [value]="0">Male</mat-radio-button>
                    <mat-radio-button [value]="1">Female</mat-radio-button>
                    <mat-radio-button [value]="2">Other</mat-radio-button>

                </mat-radio-group>
            </div>
        </label>

        <label>
            Date of Birth
            <div>
                <mat-form-field>
                    <mat-label>MM/DD/YYYY</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="dob">
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </div>
        </label>
        <label>
            Age
            <div>
                <mat-form-field>
                    <input matInput formControlName="age" />
                </mat-form-field>
            </div>
        </label>
        <label>
            Category
            <div>
                <mat-form-field>
                    <mat-label>--Select--</mat-label>
                    <mat-select formControlName="category">
                        @for (item of categories; track item) {
                        <mat-option [value]="item.value">{{item.viewValue}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </div>
        </label>
    </div>
</div>
