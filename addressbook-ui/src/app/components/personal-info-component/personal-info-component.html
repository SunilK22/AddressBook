<div class="example-form" [formGroup]="personalDetails">
    <header>
        <h3>
            Personal Information
        </h3>
    </header>
    <div class="container">
        <mat-label>
            Title
            <div>
                <mat-form-field>
                    <mat-label>--Select--</mat-label>
                    <mat-select formControlName="title">
                        @for (item of titles; track item) {
                        <mat-option [value]="item.value">{{item.viewValue}}</mat-option>
                        }
                    </mat-select>
                    @if(personalDetails.get('title')?.hasError('required')){
                    <mat-error>
                        *Please select title.
                    </mat-error>
                    }
                </mat-form-field>
            </div>
        </mat-label>

        <label>
            First Name
            <div>
                <mat-form-field>
                    <input matInput formControlName="firstname" />
                    @if(personalDetails.get('firstname')?.hasError('required')){
                    <mat-error>
                        *First name is required.
                    </mat-error>
                    }
                </mat-form-field>
            </div>
        </label>

        <label>
            Middle Name
            <div>
                <mat-form-field>
                    <input matInput formControlName="middlename" />
                </mat-form-field>
            </div>
        </label>
        <label>
            Last Name
            <div>
                <mat-form-field>
                    <input formControlName="lastname" matInput />
                    @if(personalDetails.get('lastname')?.hasError('required')){
                    <mat-error>
                        *Last name is required.
                    </mat-error>
                    }
                </mat-form-field>
            </div>
        </label>

    </div>
    <div class="container">
        <label>
            Gender
            <div>
                <mat-radio-group formControlName="gender" aria-label="Select an option">
                    <mat-radio-button [value]="0">Male</mat-radio-button>
                    <mat-radio-button [value]="1">Female</mat-radio-button>
                    <mat-radio-button [value]="2">Other</mat-radio-button>
                </mat-radio-group>
            </div>
            
            @if (personalDetails.get('gender')?.hasError('required') && personalDetails.get('gender')?.touched) {
            <small class="alert-error">*Gender is required.</small>
            }

        </label>

        <label>
            Date of Birth
            <div>
                <mat-form-field>
                    <mat-label>MM/DD/YYYY</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="dob">
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>

                    @if(personalDetails.get('dob')?.hasError('required')){
                    <mat-error>
                        *Date of birth is required.
                    </mat-error>
                    }
                </mat-form-field>
            </div>

        </label>
        <label>
            Age
            <div>
                <mat-form-field>
                    <input matInput formControlName="age" />
                </mat-form-field>
            </div>
        </label>
        <label>
            Category
            <div>
                <mat-form-field>
                    <mat-label>--Select--</mat-label>
                    <mat-select formControlName="category">
                        @for (item of categories; track item) {
                        <mat-option [value]="item.value">{{item.viewValue}}</mat-option>
                        }
                    </mat-select>

                    @if(personalDetails.get('category')?.hasError('required')){
                    <mat-error>
                        *Categiry is required.
                    </mat-error>
                    }
                </mat-form-field>
            </div>

        </label>
    </div>
</div>
