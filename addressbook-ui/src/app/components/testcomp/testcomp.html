<h2>Your Name: {{_name | uppercase}}</h2>


<div class="example-button-row">
    <button matButton="filled" (click)="showAlert()">Click Me</button>
</div>
<br>

<form class="example-form">
    <mat-form-field class="example-full-width">
        <mat-label>Enter your name</mat-label>
        <!-- <input matInput placeholder="Ex. John" [(ngModel)]="_name" name="username"> -->
        <input matInput (keyup)="updateName($event)">
    </mat-form-field>
</form>
