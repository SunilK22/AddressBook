<mat-card>
    <mat-card-header>
        <h2>{{tableTitle}}</h2>
    </mat-card-header>

    <mat-card-content>
        <table>
            <ng-container>
                <th mat-header-cell>Type</th>
            </ng-container>

            <ng-container>
                <th mat-header-cell>{{tableTitle}}</th>
            </ng-container>

            <ng-container>
                <th mat-header-cell>Actions</th>
                <td>
                    <button mat-icon-button color="primary" aria-label="Edit item">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" aria-label="Delete item">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>
        </table>

    </mat-card-content>

</mat-card>
