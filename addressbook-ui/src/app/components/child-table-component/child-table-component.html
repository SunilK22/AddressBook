@if (!isViewMode) {

<div class="entry-form">
    <mat-form-field>
        <mat-label>Type</mat-label>
        <mat-select [(ngModel)]="newType" [ngModelOptions]="{standalone: true}">
            @for (option of typeOptions; track option.value) {
            <mat-option [value]="option.value">{{ option.viewValue }}</mat-option>
            }
        </mat-select>
    </mat-form-field>

    <mat-form-field>
        <mat-label>{{ tableTitle }}</mat-label>
        <input matInput [type]="inputType" [maxlength]="maxLength" [(ngModel)]="newValue"
            [ngModelOptions]="{standalone: true}" />
    </mat-form-field>

    <button matButton="filled" type="button" [disabled]="!newValue.trim() || newValue.trim().length > maxLength"
        (click)="addItem()">
        Add
    </button>
</div>
}

<table mat-table [dataSource]="arrayData.value" class="mat-elevation-z1 w-full">
    <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let element">{{ typeLabel(element.type) }}</td>
    </ng-container>

    <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef>{{ tableTitle }}</th>
        <td mat-cell *matCellDef="let element">{{ element.value }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="warn" type="button" disabled=[!isViewMode]
                (click)="removeItem(arrayData.controls.indexOf(element))">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
