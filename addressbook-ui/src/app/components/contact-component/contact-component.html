<mat-card>
    <mat-card-header>
        <h2>Contact List</h2>
    </mat-card-header>

    <mat-card-content>

        <div class="mat-shadow-2">
            <table mat-table [dataSource]="contacts" matSort>

                <!-- ID Column -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header="contactID"> # </th>
                    <td mat-cell *matCellDef="let row"> {{row.contactID}} </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header="firstName"> Name </th>
                    <td mat-cell *matCellDef="let row"> {{row.firstName | fullName : row.middleName: row.lastName}} </td>
                </ng-container>

                <!-- Category Column -->
                <ng-container matColumnDef="category">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header="contactCategory"> Category </th>
                    <td mat-cell *matCellDef="let row"> {{row.contactCategory}} </td>
                </ng-container>

                <!-- Phone Column -->
                <ng-container matColumnDef="phones">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header="phones"> Phone(s) </th>
                    <td mat-cell *matCellDef="let row"> {{row.phones?.length || 0}} </td>
                </ng-container>

                <!-- Email Column -->
                <ng-container matColumnDef="emails">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header="emails"> Email(s) </th>
                    <td mat-cell *matCellDef="let row"> {{row.emails?.length || 0}} </td>
                </ng-container>

                <!-- Social Media Column -->
                <ng-container matColumnDef="socialmedias">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header="socialMedias"> Social Media(s) </th>
                    <td mat-cell *matCellDef="let row"> {{row.socialMedias?.length || 0}} </td>
                </ng-container>

                <!-- action Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Actions </th>
                    <td mat-cell *matCellDef="let row">
                        <button mat-icon-button color="primary" aria-label="View item" (click)="viewContact(row)">
                            <mat-icon>visibility</mat-icon>
                        </button>
                        <button mat-icon-button color="primary" aria-label="Edit item" (click)="editContact(row)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" aria-label="Delete item" (click)="deleteContact(row)">
                            <mat-icon>delete</mat-icon>
                        </button>

                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns">
                </tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- Row shown when there is no matching data. -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" [attr.colspan]="displayedColumns.length">Data Not Available</td>
                </tr>
            </table>

            <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25, 100]"
                aria-label="Select page of users"></mat-paginator>
        </div>

    </mat-card-content>
</mat-card>
