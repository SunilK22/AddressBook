<mat-card>
    <mat-card-header>
        <h2>Add New Contact</h2>
        <span class="example-spacer"></span>

        <button matButton="filled" mat-button>Save</button>
        <button matButton="tonal" mat-button>Cancel</button>
    </mat-card-header>
    <mat-card-content>
        <section>
            <app-personal-info-component></app-personal-info-component>
        </section>

        <mat-accordion>
            <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
                <mat-expansion-panel-header>

                    <mat-panel-title>
                        Phone Numbers
                    </mat-panel-title>
                    <mat-panel-description>
                        <button matButton="filled"><mat-icon>add</mat-icon>Contact</button>
                    </mat-panel-description>
                </mat-expansion-panel-header>
                <app-child-table-component tableTitle="Phone Number">

                </app-child-table-component>
            </mat-expansion-panel>

        </mat-accordion>

        <mat-accordion>
            <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
                <mat-expansion-panel-header>

                    <mat-panel-title>
                        Email Addresses
                    </mat-panel-title>
                    <mat-panel-description>
                        <button matButton="filled"><mat-icon>add</mat-icon>Email</button>
                    </mat-panel-description>

                </mat-expansion-panel-header>
                <app-child-table-component tableTitle="Email Address">

                </app-child-table-component>
            </mat-expansion-panel>
        </mat-accordion>


        <section>
            <mat-accordion>
                <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
                    <mat-expansion-panel-header>

                        <mat-panel-title>
                            Social Media Contacts
                        </mat-panel-title>

                        <mat-panel-description>
                            <button matButton="filled"><mat-icon>add</mat-icon>Social Media</button>
                        </mat-panel-description>
                    </mat-expansion-panel-header>
                    <app-child-table-component tableTitle="Address">

                    </app-child-table-component>
                </mat-expansion-panel>
            </mat-accordion>

        </section>

    </mat-card-content>

</mat-card>
