<form (ngSubmit)="SaveContact()">
    <mat-card>
        <mat-card-header>
            <h2>Add New Contact</h2>
            <span class="example-spacer"></span>

            <button matButton="filled" type="submit">Save</button>
            <button matButton="tonal" type="button">Cancel</button>
        </mat-card-header>
        <mat-card-content>
            <section>
                <app-personal-info-component></app-personal-info-component>
            </section>

            <mat-accordion>
                <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
                    <mat-expansion-panel-header>
                        <mat-panel-title>Phone Numbers</mat-panel-title>
                    </mat-expansion-panel-header>
                    <app-child-table-component
                        tableTitle="Phone Number"
                        kind="phone"
                        [dataSource]="phones"
                        (dataSourceChange)="phones = $event">
                    </app-child-table-component>
                </mat-expansion-panel>

                <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
                    <mat-expansion-panel-header>
                        <mat-panel-title>Email Addresses</mat-panel-title>
                    </mat-expansion-panel-header>
                    <app-child-table-component
                        tableTitle="Email Address"
                        kind="email"
                        [dataSource]="emails"
                        (dataSourceChange)="emails = $event">
                    </app-child-table-component>
                </mat-expansion-panel>

                <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
                    <mat-expansion-panel-header>
                        <mat-panel-title>Social Media Contacts</mat-panel-title>
                    </mat-expansion-panel-header>
                    <app-child-table-component
                        tableTitle="Social Media Address"
                        kind="socialMedia"
                        [dataSource]="socialMedia"
                        (dataSourceChange)="socialMedia = $event">
                    </app-child-table-component>
                </mat-expansion-panel>
            </mat-accordion>
        </mat-card-content>
    </mat-card>
</form>
